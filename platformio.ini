; Configuracao do PlatformIO para a Sentinela de Wake-on-LAN.
; Alvo: ESP32 DevKit fisico, gravado por USB.

[env:esp32dev]
; Versao fixa em vez de "espressif32" solto: garante que quem clonar o
; repo daqui a um ano compile com o mesmo toolchain que foi validado.
; Para atualizar de proposito, subir o numero e recompilar.
platform = espressif32@7.1.1
board = esp32dev
framework = arduino

monitor_speed = 115200
; Traduz backtrace de crash em arquivo:linha em vez de enderecos crus.
monitor_filters = esp32_exception_decoder

; Sem lib_deps: o ping usa a API nativa do ESP-IDF (ping_sock.h), que ja
; vem no liblwip.a do core. Nenhuma biblioteca externa e necessaria.
